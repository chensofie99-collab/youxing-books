<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c0907">
<title>长城往事 · 李守中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --parch:#fdf9f2;--parch2:#f2e8d4;--parch3:#dfd0ad;
  --ink:#1a1208;--ink2:#3d2f1a;--ink3:#7a6650;
  --cr:#6b0d0d;--gold:#b8892a;--dark:#0c0907;--dark2:#1a120a;
  --topbar:52px;--fs:17px;--lh:2.05;
  /* Mobile-first: comfortable reading */
  --max-w:680px;--px:20px;
}
.night{--parch:#18140f;--parch2:#201a12;--parch3:#2e2518;
  --ink:#e2d8c4;--ink2:#c4b48e;--ink3:#8a7a62;--cr:#c87070;--gold:#c49a3c}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--fs);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--parch);color:var(--ink);font-family:'Noto Serif SC',serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
::selection{background:rgba(184,137,42,.22)}

/* ── GATE ── */
#gate{position:fixed;inset:0;z-index:1000;background:var(--dark);
  display:flex;align-items:center;justify-content:center;padding:16px}
.gate-box{background:var(--parch2);border:1px solid var(--parch3);border-radius:6px;
  padding:36px 28px;width:100%;max-width:380px;text-align:center}
.g-title{font-size:24px;font-weight:700;color:var(--cr);margin-bottom:4px;letter-spacing:.06em}
.g-sub{font-family:'EB Garamond',serif;font-style:italic;font-size:13px;
  color:var(--ink3);margin-bottom:24px;letter-spacing:.08em}
.g-label{font-size:11px;color:var(--ink3);text-align:left;margin-bottom:5px;letter-spacing:.08em}
.g-input{width:100%;padding:12px 14px;border:1px solid var(--parch3);
  background:var(--parch);color:var(--ink);font-size:16px;border-radius:4px;
  margin-bottom:12px;outline:none;font-family:inherit;-webkit-appearance:none}
.g-input:focus{border-color:var(--gold)}
.g-btn{width:100%;padding:13px;background:var(--cr);color:#fdf9f2;border:none;
  border-radius:4px;font-size:14px;letter-spacing:.1em;cursor:pointer;
  font-family:inherit;transition:background .2s;-webkit-appearance:none}
.g-btn:active{background:#8b1a1a}
.g-btn:disabled{opacity:.5}
.g-err{font-size:12px;color:var(--cr);margin-top:8px;min-height:16px}
.g-note{font-size:11px;color:var(--ink3);margin-top:14px;line-height:1.85}
.g-icon{font-size:32px;margin-bottom:12px}
.g-msg{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:8px}
.g-detail{font-size:13px;color:var(--ink3);line-height:1.9;margin-bottom:16px}
.g-link{font-size:12px;color:var(--cr);background:none;border:none;
  cursor:pointer;text-decoration:underline;font-family:inherit;padding:0;margin-top:6px;display:block}

/* ── TOP BAR ── */
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--topbar);
  background:rgba(253,249,242,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--parch3);display:none;align-items:center;
  padding:0 12px;gap:8px;transition:background .3s}
.night #topbar{background:rgba(24,20,15,.97)}
.tb-btn{background:none;border:none;cursor:pointer;color:var(--ink3);
  padding:8px;border-radius:4px;display:flex;align-items:center;
  transition:color .2s;-webkit-tap-highlight-color:transparent;min-width:40px;min-height:40px;justify-content:center}
.tb-btn:active{color:var(--cr)}
.tb-btn svg{width:22px;height:22px}
.tb-center{flex:1;text-align:center;font-size:12px;color:var(--ink2);
  letter-spacing:.05em;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-ch{color:var(--ink3);font-weight:400}
.tb-r{display:flex;gap:2px;align-items:center}
.f-btn{background:none;border:1px solid var(--parch3);cursor:pointer;color:var(--ink3);
  padding:4px 8px;border-radius:3px;font-size:12px;line-height:1;font-family:inherit;
  min-width:36px;min-height:32px;-webkit-tap-highlight-color:transparent}
.f-btn:active{border-color:var(--gold);color:var(--cr)}

/* ── PROGRESS ── */
#pbar{position:fixed;top:var(--topbar);left:0;right:0;z-index:99;
  height:3px;background:var(--parch3);display:none}
#pfill{height:100%;background:var(--cr);width:0%;transition:width .4s}

/* ── SIDEBAR ── */
#sidebar{position:fixed;top:0;left:0;bottom:0;z-index:200;
  width:min(300px, 82vw);background:var(--parch);border-right:1px solid var(--parch3);
  transform:translateX(calc(-1 * min(300px, 82vw) - 2px));
  transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;
  padding-bottom:env(safe-area-inset-bottom,20px);-webkit-overflow-scrolling:touch}
#sidebar.open{transform:translateX(0);box-shadow:4px 0 28px rgba(0,0,0,.18)}
.sb-head{padding:18px 18px 14px;border-bottom:1px solid var(--parch3);
  position:sticky;top:0;background:var(--parch);z-index:1}
.sb-book{font-size:15px;font-weight:700;color:var(--cr);letter-spacing:.06em}
.sb-auth{font-size:11px;color:var(--ink3);letter-spacing:.1em;margin-top:2px}
.sb-x{position:absolute;top:14px;right:14px;background:none;border:none;
  cursor:pointer;color:var(--ink3);padding:6px;min-width:36px;min-height:36px;
  display:flex;align-items:center;justify-content:center}
.toc-list{list-style:none;padding:6px 0}
.toc-item{display:flex;align-items:baseline;gap:10px;padding:12px 18px;cursor:pointer;
  border-left:3px solid transparent;transition:all .15s;
  -webkit-tap-highlight-color:transparent}
.toc-item:active{background:var(--parch2)}
.toc-item.active{background:rgba(107,13,13,.06);border-left-color:var(--cr)}
.toc-n{font-family:'EB Garamond',serif;font-size:13px;color:var(--gold);flex-shrink:0;min-width:28px}
.toc-t{font-size:14px;color:var(--ink2);line-height:1.4}
.toc-item.active .toc-t{color:var(--cr);font-weight:600}
#overlay{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:opacity .3s}
#overlay.show{opacity:1;pointer-events:all}

/* ── READER ── */
#reader{padding-top:calc(var(--topbar) + 3px);min-height:100vh;display:none}
.ch-wrap{max-width:var(--max-w);margin:0 auto;
  padding:40px var(--px) max(100px, env(safe-area-inset-bottom, 100px))}

/* Chapter header */
.ch-hd{text-align:center;margin-bottom:40px;padding-bottom:28px;border-bottom:1px solid var(--parch3)}
.ch-num{font-family:'EB Garamond',serif;font-size:12px;font-style:italic;
  color:var(--gold);letter-spacing:.22em;margin-bottom:10px;text-transform:uppercase}
.ch-title{font-size:clamp(20px,5vw,26px);font-weight:700;color:var(--cr);
  letter-spacing:.05em;line-height:1.35}

/* Body text — optimised for mobile reading */
#ch-body p{
  font-size:var(--fs);line-height:var(--lh);color:var(--ink);
  margin-bottom:1.2em;text-indent:2em;
  word-break:break-word;overflow-wrap:break-word;
  -webkit-hyphens:auto;hyphens:auto
}
#ch-body h3.s-head{
  font-size:calc(var(--fs) * 0.95);font-weight:600;color:var(--ink2);
  letter-spacing:.08em;text-align:center;
  margin:1.8em 0 1em;text-indent:0
}

/* Loading */
.ch-loading{text-align:center;padding:60px 0;color:var(--ink3);font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:14px}
.spinner{width:26px;height:26px;border:2px solid var(--parch3);
  border-top-color:var(--cr);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── BOTTOM NAV (mobile-friendly) ── */
.ch-nav{
  display:flex;justify-content:space-between;align-items:center;
  padding:24px 0 0;border-top:1px solid var(--parch3);margin-top:36px;gap:8px
}
.nav-btn{
  display:flex;align-items:center;gap:6px;background:none;
  border:1px solid var(--parch3);color:var(--ink3);
  padding:12px 16px;border-radius:4px;cursor:pointer;
  font-family:inherit;font-size:13px;letter-spacing:.05em;
  transition:all .15s;-webkit-tap-highlight-color:transparent;
  min-height:44px;flex:1;justify-content:center;max-width:140px
}
.nav-btn:active{border-color:var(--cr);color:var(--cr);background:rgba(107,13,13,.04)}
.nav-btn:disabled{opacity:.3;pointer-events:none}
.nav-btn svg{width:16px;height:16px;flex-shrink:0}
.pg-txt{font-size:11px;color:var(--ink3);letter-spacing:.06em;white-space:nowrap}

/* ── WATERMARK ── */
#watermark{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.wm-text{position:absolute;font-size:10px;color:rgba(0,0,0,.04);
  transform:rotate(-25deg);white-space:nowrap;user-select:none;pointer-events:none}
.night .wm-text{color:rgba(255,255,255,.035)}

/* ── RESUME TOAST ── */
#toast{
  position:fixed;bottom:max(24px, env(safe-area-inset-bottom,24px));
  left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--dark2);color:rgba(253,249,242,.92);
  padding:12px 16px;border-radius:8px;z-index:300;font-size:13px;
  display:flex;align-items:center;gap:10px;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  white-space:nowrap;max-width:calc(100vw - 32px);box-shadow:0 4px 20px rgba(0,0,0,.3)
}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast button{background:var(--cr);border:none;color:#fdf9f2;
  padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px;
  font-family:inherit;letter-spacing:.06em;min-height:32px;white-space:nowrap}
#toast .dim{background:transparent;border:1px solid rgba(253,249,242,.2);
  color:rgba(253,249,242,.5)}

/* ── SAFE AREAS ── */
@supports(padding:max(0px)){
  .ch-wrap{padding-left:max(var(--px), env(safe-area-inset-left));
    padding-right:max(var(--px), env(safe-area-inset-right))}
}

/* ── LARGER SCREENS ── */
@media(min-width:480px){
  :root{--px:32px;--fs:18px}
}
@media(min-width:768px){
  :root{--px:5vw;--fs:18px}
  .nav-btn span{display:inline}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* Scrollbar */
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--parch3);border-radius:2px}
</style>
</head>
<body>

<!-- GATE -->
<div id="gate">
  <div class="gate-box">
    <div id="g-a">
      <div class="g-title">长城往事</div>
      <div class="g-sub">李守中 著 · 柏杨推荐 · 简体中文</div>
      <div class="g-label">购书邮箱</div>
      <input class="g-input" id="g-email" type="email" inputmode="email" autocomplete="email"
             placeholder="输入购书时的邮箱地址" onkeydown="if(event.key==='Enter')sendLink()">
      <button class="g-btn" id="g-send" onclick="sendLink()">发送一键登录链接</button>
      <div class="g-err" id="g-err"></div>
      <div class="g-note">我们将向您的邮箱发送安全登录链接，点击即可进入阅读，无需密码。</div>
    </div>
    <div id="g-b" style="display:none">
      <div class="g-icon">📬</div>
      <div class="g-msg">登录链接已发送</div>
      <div class="g-detail">请查看 <strong id="g-addr" style="color:var(--cr)"></strong> 的收件箱，点击邮件中的链接进入阅读。<br><br>未收到请检查垃圾邮件。</div>
      <button class="g-link" onclick="showG('a')">换个邮箱重试</button>
    </div>
    <div id="g-c" style="display:none">
      <div class="g-icon">📚</div>
      <div class="g-msg">未找到购书记录</div>
      <div class="g-detail">邮箱 <strong id="g-np" style="color:var(--cr)"></strong> 尚未购买此书。</div>
      <a class="g-btn" href="/buy/changcheng" style="display:block;text-align:center;text-decoration:none;margin-bottom:10px">前往购书 $5.90</a>
      <button class="g-link" onclick="doSignOut()">换个账号登录</button>
    </div>
    <div id="g-d" style="display:none">
      <div class="g-icon">⏳</div>
      <div class="g-msg">验证中…</div>
    </div>
  </div>
</div>

<!-- TOP BAR -->
<div id="topbar">
  <button class="tb-btn" onclick="toggleSB()" title="目录" aria-label="目录">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="16" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="tb-center">长城往事 <span class="tb-ch" id="tb-ch"></span></div>
  <div class="tb-r">
    <div style="display:flex;gap:2px">
      <button class="f-btn" onclick="setFont(-1)" aria-label="缩小字体">A⁻</button>
      <button class="f-btn" onclick="setFont(1)" aria-label="放大字体">A⁺</button>
    </div>
    <button class="tb-btn" onclick="toggleNight()" title="夜间模式" aria-label="夜间模式">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</div>
<div id="pbar"><div id="pfill"></div></div>

<!-- SIDEBAR -->
<div id="overlay" onclick="closeSB()"></div>
<div id="sidebar">
  <div class="sb-head">
    <div class="sb-book">长城往事</div>
    <div class="sb-auth" id="sb-email">李守中 著 · 全43章</div>
    <button class="sb-x" onclick="closeSB()" aria-label="关闭目录">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
  <ul class="toc-list" id="toc" role="list"></ul>
</div>

<!-- READER -->
<div id="reader" role="main">
  <div class="ch-wrap">
    <div class="ch-hd">
      <div class="ch-num" id="rd-num"></div>
      <h1 class="ch-title" id="rd-title"></h1>
    </div>
    <div id="ch-body"></div>
    <div class="ch-nav">
      <button class="nav-btn" id="btn-prev" onclick="prevCh()" aria-label="上一章">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        <span>上一章</span>
      </button>
      <span class="pg-txt" id="pg-txt" aria-live="polite"></span>
      <button class="nav-btn" id="btn-next" onclick="nextCh()" aria-label="下一章">
        <span>下一章</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- WATERMARK -->
<div id="watermark" aria-hidden="true"></div>

<!-- RESUME TOAST -->
<div id="toast" role="status">
  <span id="toast-txt"></span>
  <button onclick="doResume()">继续阅读</button>
  <button class="dim" onclick="closeToast()">从头</button>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

// ════════════════════════════════════
//  ★ 填入你的 Supabase 信息
// ════════════════════════════════════
const SUPABASE_URL      = 'https://csjbozilckbtkvgvaudq.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_AkkPhcFoEK-mH5sdHSfV0g_3lGQYZee'
// ════════════════════════════════════
const BOOK = 'changcheng'

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

let toc = [], cache = {}, cur = 0, saveTimer = null, userEmail = ''
let fontSize = +(localStorage.getItem(BOOK+'_font') || 17)
let nightMode = localStorage.getItem(BOOK+'_night') === '1'

applySettings()

sb.auth.onAuthStateChange(async (evt, session) => {
  if (evt === 'SIGNED_IN' && session) { showG('d'); await start(session.user.email) }
  if (evt === 'SIGNED_OUT') showG('a')
})

;(async () => {
  showG('d')
  const { data: { session } } = await sb.auth.getSession()
  if (session) await start(session.user.email)
  else showG('a')
})()

window.sendLink = async () => {
  const email = document.getElementById('g-email').value.trim()
  const err = document.getElementById('g-err')
  err.textContent = ''
  if (!email.includes('@')) { err.textContent = '请输入有效邮箱地址'; return }
  const btn = document.getElementById('g-send')
  btn.disabled = true; btn.textContent = '发送中…'
  const { error } = await sb.auth.signInWithOtp({
    email, options: { emailRedirectTo: window.location.href }
  })
  btn.disabled = false; btn.textContent = '发送一键登录链接'
  if (error) { err.textContent = '发送失败：' + error.message; return }
  document.getElementById('g-addr').textContent = email
  showG('b')
}
window.doSignOut = async () => { await sb.auth.signOut(); showG('a') }

async function start(email) {
  userEmail = email
  const { data } = await sb.from('purchases').select('id')
    .eq('email', email).in('book', [BOOK, 'all']).maybeSingle()
  if (!data) { document.getElementById('g-np').textContent = email; showG('c'); return }
  await loadTOC(); launchReader(email)
}

async function loadTOC() {
  const { data } = await sb.from('chapter_toc').select('chapter_index,num,title')
    .eq('book', BOOK).order('chapter_index')
  toc = data || []; buildTOC()
}

function launchReader(email) {
  document.getElementById('gate').style.display = 'none'
  document.getElementById('topbar').style.display = 'flex'
  document.getElementById('pbar').style.display = 'block'
  document.getElementById('reader').style.display = 'block'
  document.getElementById('sb-email').textContent = email
  buildWatermark(email)
  const pos = getPos()
  if (pos && pos.chapter > 0 && toc[pos.chapter]) {
    document.getElementById('toast-txt').textContent =
      `上次：第${toc[pos.chapter].num}章《${toc[pos.chapter].title}》`
    setTimeout(() => document.getElementById('toast').classList.add('show'), 800)
  }
  showCh(0)
}

function buildTOC() {
  const ul = document.getElementById('toc'); ul.innerHTML = ''
  toc.forEach((ch, i) => {
    const li = document.createElement('li')
    li.className = 'toc-item'; li.setAttribute('role','listitem')
    li.innerHTML = `<span class="toc-n">${ch.num}</span><span class="toc-t">${ch.title}</span>`
    li.onclick = () => { showCh(i); closeSB() }
    ul.appendChild(li)
  })
}

async function showCh(i, top=true) {
  if (i < 0 || i >= toc.length) return
  cur = i; const ch = toc[i]
  document.querySelectorAll('.toc-item').forEach((el,j) => el.classList.toggle('active', j===i))
  document.getElementById('rd-num').textContent = `第${ch.num}章`
  document.getElementById('rd-title').textContent = ch.title
  document.getElementById('tb-ch').textContent = ` · ${ch.title}`
  document.getElementById('pg-txt').textContent = `${i+1} / ${toc.length}`
  document.getElementById('btn-prev').disabled = i === 0
  document.getElementById('btn-next').disabled = i === toc.length - 1
  if (top) window.scrollTo({top:0, behavior:'instant'})
  if (cache[i]) { render(cache[i]); sched(); return }
  document.getElementById('ch-body').innerHTML =
    '<div class="ch-loading"><div class="spinner"></div>加载中…</div>'
  const { data, error } = await sb.from('chapters').select('content')
    .eq('book', BOOK).eq('chapter_index', i).single()
  if (error || !data) {
    document.getElementById('ch-body').innerHTML =
      '<p style="text-align:center;color:var(--ink3);padding:40px">加载失败，请刷新重试</p>'
    return
  }
  cache[i] = data.content; render(data.content); sched()
}

function render(html) {
  document.getElementById('ch-body').innerHTML = html; updProg()
}

window.nextCh = () => showCh(cur+1)
window.prevCh = () => showCh(cur-1)

function updProg() {
  const sp = Math.min(1, window.scrollY / Math.max(1, document.body.scrollHeight - window.innerHeight))
  document.getElementById('pfill').style.width = ((cur+sp)/toc.length*100).toFixed(1)+'%'
}
window.addEventListener('scroll', updProg, {passive:true})

function getPos() { try { return JSON.parse(localStorage.getItem(BOOK+'_pos')) } catch { return null } }
function savePos() {
  const sp = window.scrollY / Math.max(1, document.body.scrollHeight - window.innerHeight)
  localStorage.setItem(BOOK+'_pos', JSON.stringify({chapter:cur, scroll:sp}))
}
function sched() { clearInterval(saveTimer); saveTimer = setInterval(savePos, 3000) }
window.addEventListener('beforeunload', savePos)

window.doResume = () => {
  const p = getPos(); closeToast()
  if (!p) return
  showCh(p.chapter, true)
  if (p.scroll > 0) setTimeout(() =>
    window.scrollTo({top: p.scroll*(document.body.scrollHeight-window.innerHeight), behavior:'smooth'}), 150)
}
window.closeToast = () => document.getElementById('toast').classList.remove('show')

function buildWatermark(email) {
  const wm = document.getElementById('watermark'); wm.innerHTML = ''
  const label = `${email} · youxingshijia.com`
  for (let r=0; r<8; r++) for (let c=0; c<4; c++) {
    const s = document.createElement('span'); s.className='wm-text'
    s.textContent = label; s.style.top=`${r*13+4}%`; s.style.left=`${c*27-2}%`
    wm.appendChild(s)
  }
}

window.toggleSB = () => {
  const sb=document.getElementById('sidebar'),ov=document.getElementById('overlay')
  sb.classList.contains('open') ? closeSB() : (sb.classList.add('open'),ov.classList.add('show'))
}
window.closeSB = () => {
  document.getElementById('sidebar').classList.remove('open')
  document.getElementById('overlay').classList.remove('show')
}

window.setFont = d => {
  fontSize = Math.max(14, Math.min(22, fontSize+d))
  document.documentElement.style.setProperty('--fs', fontSize+'px')
  localStorage.setItem(BOOK+'_font', fontSize)
}
window.toggleNight = () => {
  nightMode = !nightMode
  document.body.classList.toggle('night', nightMode)
  localStorage.setItem(BOOK+'_night', nightMode?'1':'0')
}
function applySettings() {
  document.documentElement.style.setProperty('--fs', fontSize+'px')
  if (nightMode) document.body.classList.add('night')
}

function showG(s) {
  ['a','b','c','d'].forEach(id => {
    document.getElementById('g-'+id).style.display = id===s?'block':'none'
  })
}

// Keyboard nav
document.addEventListener('keydown', e => {
  if (document.getElementById('gate').style.display!=='none') return
  if (e.key==='ArrowRight'||e.key==='PageDown') nextCh()
  if (e.key==='ArrowLeft' ||e.key==='PageUp')   prevCh()
  if (e.key==='Escape') closeSB()
})

// Content protection
document.addEventListener('contextmenu', e => e.preventDefault())
document.addEventListener('selectstart', e => {
  if (e.target.closest('#reader')) e.preventDefault()
})
document.addEventListener('copy', e => {
  if (e.target.closest('#reader')) {
    e.clipboardData.setData('text/plain', '© 李守中著作版权所有 · youxingshijia.com')
    e.preventDefault()
  }
})
</script>
