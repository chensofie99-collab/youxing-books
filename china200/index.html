<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c0907">
<title>中国二百年 · 李守中</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --parch:#fdf9f2;--parch2:#f2e8d4;--parch3:#dfd0ad;
  --ink:#1a1208;--ink2:#3d2f1a;--ink3:#7a6650;
  --cr:#6b0d0d;--gold:#b8892a;--dark:#0c0907;--dark2:#1a120a;
  --topbar:52px;--fs:17px;--lh:2.05;
}
.night{--parch:#1a1410;--parch2:#201a12;--parch3:#2e2518;
  --ink:#e2d8c4;--ink2:#c4b48e;--ink3:#8a7a62;--cr:#c87070;--gold:#c49a3c}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--fs);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--parch);color:var(--ink);font-family:'Noto Serif SC',serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
::selection{background:rgba(184,137,42,.22)}

/* ── GATE ── */
#gate{position:fixed;inset:0;z-index:1000;background:var(--dark);
  display:flex;align-items:center;justify-content:center;padding:16px}
.gate-box{background:var(--parch2);border:1px solid var(--parch3);border-radius:6px;
  padding:36px 28px;width:100%;max-width:380px;text-align:center}
.g-title{font-size:24px;font-weight:700;color:var(--cr);margin-bottom:4px;letter-spacing:.06em}
.g-sub{font-family:'EB Garamond',serif;font-style:italic;font-size:13px;
  color:var(--ink3);margin-bottom:24px;letter-spacing:.08em}
.g-label{font-size:11px;color:var(--ink3);text-align:left;margin-bottom:5px;letter-spacing:.08em}
.g-input{width:100%;padding:12px 14px;border:1px solid var(--parch3);
  background:var(--parch);color:var(--ink);font-size:16px;border-radius:4px;
  margin-bottom:12px;outline:none;font-family:inherit;-webkit-appearance:none}
.g-input:focus{border-color:var(--gold)}
.g-btn{width:100%;padding:13px;background:var(--cr);color:#fdf9f2;border:none;
  border-radius:4px;font-size:14px;letter-spacing:.1em;cursor:pointer;
  font-family:inherit;transition:background .2s}
.g-btn:active{background:#8b1a1a}
.g-btn:disabled{opacity:.5}
.g-err{font-size:12px;color:var(--cr);margin-top:8px;min-height:16px}
.g-note{font-size:11px;color:var(--ink3);margin-top:14px;line-height:1.85}
.g-icon{font-size:32px;margin-bottom:12px}
.g-msg{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:8px}
.g-detail{font-size:13px;color:var(--ink3);line-height:1.9;margin-bottom:16px}
.g-link{font-size:12px;color:var(--cr);background:none;border:none;
  cursor:pointer;text-decoration:underline;font-family:inherit;padding:0;display:block;margin-top:6px}

/* ── TOPBAR ── */
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--topbar);
  background:rgba(253,249,242,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--parch3);display:none;align-items:center;
  padding:0 12px;gap:8px;transition:background .3s}
.night #topbar{background:rgba(26,20,16,.97)}
.tb-btn{background:none;border:none;cursor:pointer;color:var(--ink3);
  padding:8px;border-radius:4px;display:flex;align-items:center;
  min-width:40px;min-height:40px;justify-content:center;
  -webkit-tap-highlight-color:transparent}
.tb-btn:active{color:var(--cr)}
.tb-btn svg{width:22px;height:22px}
.tb-center{flex:1;text-align:center;font-size:12px;color:var(--ink2);
  letter-spacing:.05em;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-ch{color:var(--ink3);font-weight:400}
.tb-r{display:flex;gap:2px;align-items:center}
.f-btn{background:none;border:1px solid var(--parch3);cursor:pointer;color:var(--ink3);
  padding:4px 8px;border-radius:3px;font-size:12px;font-family:inherit;
  min-width:36px;min-height:32px;-webkit-tap-highlight-color:transparent}
.f-btn:active{border-color:var(--gold);color:var(--cr)}

/* ── PROGRESS ── */
#pbar{position:fixed;top:var(--topbar);left:0;right:0;z-index:99;
  height:3px;background:var(--parch3);display:none}
#pfill{height:100%;background:var(--cr);width:0%;transition:width .4s}

/* ── SIDEBAR ── */
#sidebar{position:fixed;top:0;left:0;bottom:0;z-index:200;
  width:min(300px,82vw);background:var(--parch);border-right:1px solid var(--parch3);
  transform:translateX(calc(-1 * min(300px,82vw) - 2px));
  transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;
  padding-bottom:env(safe-area-inset-bottom,20px);-webkit-overflow-scrolling:touch}
#sidebar.open{transform:translateX(0);box-shadow:4px 0 28px rgba(0,0,0,.18)}
.sb-head{padding:18px 18px 14px;border-bottom:1px solid var(--parch3);
  position:sticky;top:0;background:var(--parch);z-index:1}
.sb-book{font-size:15px;font-weight:700;color:var(--cr);letter-spacing:.06em}
.sb-auth{font-size:11px;color:var(--ink3);letter-spacing:.1em;margin-top:2px}
.sb-x{position:absolute;top:14px;right:14px;background:none;border:none;
  cursor:pointer;color:var(--ink3);padding:6px;min-width:36px;min-height:36px;
  display:flex;align-items:center;justify-content:center}
.toc-list{list-style:none;padding:6px 0}
.toc-item{display:flex;align-items:baseline;gap:10px;padding:12px 18px;cursor:pointer;
  border-left:3px solid transparent;transition:all .15s;
  -webkit-tap-highlight-color:transparent}
.toc-item:active{background:var(--parch2)}
.toc-item.active{background:rgba(107,13,13,.06);border-left-color:var(--cr)}
.toc-n{font-family:'EB Garamond',serif;font-size:13px;color:var(--gold);
  flex-shrink:0;min-width:28px}
.toc-t{font-size:14px;color:var(--ink2);line-height:1.4}
.toc-item.active .toc-t{color:var(--cr);font-weight:600}
#overlay{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:opacity .3s}
#overlay.show{opacity:1;pointer-events:all}

/* ── READER ── */
#reader{padding-top:calc(var(--topbar) + 3px);min-height:100vh;display:none}
.ch-wrap{max-width:680px;margin:0 auto;
  padding:36px 20px max(80px, env(safe-area-inset-bottom,80px))}
@media(min-width:480px){.ch-wrap{padding:44px 32px max(80px, env(safe-area-inset-bottom,80px))}}
@media(min-width:768px){.ch-wrap{padding:52px 5vw max(100px, env(safe-area-inset-bottom,100px))}}

/* Chapter header */
.ch-hd{text-align:center;margin-bottom:36px;padding-bottom:24px;border-bottom:1px solid var(--parch3)}
.ch-num{font-family:'EB Garamond',serif;font-size:12px;font-style:italic;
  color:var(--gold);letter-spacing:.22em;margin-bottom:10px}
.ch-title{font-size:clamp(20px,5vw,26px);font-weight:700;color:var(--cr);
  letter-spacing:.05em;line-height:1.35}

/* Page content */
#page-body p{font-size:var(--fs);line-height:var(--lh);color:var(--ink);
  margin-bottom:1.2em;text-indent:2em;word-break:break-word}
#page-body p.memoir-text{text-indent:2em;color:var(--ink2);
  border-left:2px solid var(--parch3);padding-left:16px;margin-left:4px}
#page-body p.memoir-text em.quote{font-family:'EB Garamond',serif;font-style:italic;
  font-size:1.02em;color:var(--ink2);line-height:var(--lh)}
#page-body h3.s-head{font-size:1rem;font-weight:600;color:var(--ink2);
  letter-spacing:.08em;text-align:center;margin:2em 0 1.2em}
#page-body .book-img{margin:1.6em auto;text-align:center;max-width:100%}
#page-body .book-img img{max-width:min(100%,480px);height:auto;border-radius:4px;
  box-shadow:0 3px 14px rgba(0,0,0,.15);display:inline-block}
#page-body .book-img figcaption{font-size:11.5px;color:var(--ink3);margin-top:7px;
  line-height:1.75;font-family:sans-serif;letter-spacing:.04em;
  max-width:440px;margin-left:auto;margin-right:auto;font-style:italic}
/* Author bio styles */
#page-body .ai-wrap{display:grid;grid-template-columns:140px 1fr;gap:22px}
@media(max-width:480px){#page-body .ai-wrap{grid-template-columns:1fr}}
#page-body .ai-photo{width:100%;aspect-ratio:1/1.15;object-fit:cover;
  object-position:center 15%;border-radius:4px;border:2px solid var(--parch3);display:block;
  filter:sepia(10%) brightness(.96);box-shadow:0 6px 24px rgba(26,18,8,.15)}
#page-body .ai-cap{background:var(--cr);padding:7px 10px;font-size:10px;
  color:rgba(253,249,242,.85);letter-spacing:.14em;text-align:center;border-radius:0 0 4px 4px}
#page-body .ai-text p{text-indent:0;font-size:.95rem}
#page-body .ai-quote{margin:1.2em 0;padding:13px 17px;border-left:2px solid var(--cr);
  background:rgba(107,13,13,.04);font-style:italic;font-size:.9rem;color:var(--ink2);line-height:1.9}
#page-body .ai-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:1em}
#page-body .ai-tag{font-size:11px;padding:3px 9px;border:1px solid var(--parch3);
  border-radius:2px;color:var(--ink3);background:var(--parch2)}

/* Loading */
.ch-loading{text-align:center;padding:60px 0;color:var(--ink3);font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:14px}
.spinner{width:26px;height:26px;border:2px solid var(--parch3);
  border-top-color:var(--cr);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── PAGE NAVIGATION ── */
.page-nav{
  display:flex;justify-content:space-between;align-items:center;
  padding:24px 0 0;border-top:1px solid var(--parch3);margin-top:32px;gap:8px
}
.pnav-btn{
  display:flex;align-items:center;gap:5px;background:none;
  border:1px solid var(--parch3);color:var(--ink3);
  padding:11px 16px;border-radius:4px;cursor:pointer;
  font-family:inherit;font-size:13px;letter-spacing:.05em;
  transition:all .15s;-webkit-tap-highlight-color:transparent;
  min-height:44px;flex:1;justify-content:center;max-width:130px
}
.pnav-btn:active{border-color:var(--cr);color:var(--cr);background:rgba(107,13,13,.04)}
.pnav-btn:disabled{opacity:.25;pointer-events:none}
.pnav-btn svg{width:16px;height:16px;flex-shrink:0}
.pnav-info{text-align:center;font-size:12px;color:var(--ink3);
  letter-spacing:.06em;line-height:1.6;flex-shrink:0}
.pnav-info .pg-cur{font-size:16px;font-weight:600;color:var(--cr);
  font-family:'EB Garamond',serif}
.pnav-info .pg-tot{font-size:12px;color:var(--ink3)}

/* ── CHAPTER NAV (between chapters) ── */
.ch-between{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:16px;padding-top:16px;border-top:1px dashed var(--parch3);gap:8px
}
.cb-btn{display:flex;align-items:center;gap:5px;background:rgba(107,13,13,.06);
  border:1px solid rgba(107,13,13,.2);color:var(--cr);
  padding:9px 14px;border-radius:4px;cursor:pointer;
  font-family:inherit;font-size:12px;letter-spacing:.06em;
  min-height:40px;-webkit-tap-highlight-color:transparent}
.cb-btn:disabled{opacity:.25;pointer-events:none}
.cb-btn svg{width:14px;height:14px;flex-shrink:0}
.cb-label{font-size:11px;color:var(--ink3);letter-spacing:.06em;
  max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── WATERMARK ── */
#watermark{position:fixed;inset:0;pointer-events:none;z-index:10;overflow:hidden}
.wm-text{position:absolute;font-size:10px;color:rgba(0,0,0,.04);
  transform:rotate(-25deg);white-space:nowrap;user-select:none;pointer-events:none}
.night .wm-text{color:rgba(255,255,255,.035)}

/* ── TOAST ── */
#toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom,24px));
  left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--dark2);color:rgba(253,249,242,.92);
  padding:12px 16px;border-radius:8px;z-index:300;font-size:13px;
  display:flex;align-items:center;gap:10px;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  white-space:nowrap;max-width:calc(100vw - 32px);box-shadow:0 4px 20px rgba(0,0,0,.3)}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast button{background:var(--cr);border:none;color:#fdf9f2;
  padding:6px 12px;border-radius:4px;cursor:pointer;font-size:12px;
  font-family:inherit;letter-spacing:.06em;min-height:32px;white-space:nowrap}
#toast .dim{background:transparent;border:1px solid rgba(253,249,242,.2);
  color:rgba(253,249,242,.5)}

::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--parch3);border-radius:2px}

/* ── PRINT PROTECTION ── */
@media print {
  body { display: none !important; }
}

</style>
</head>
<body>

<!-- GATE -->
<div id="gate">
  <div class="gate-box">
    <div id="g-a">
      <div class="g-title">中国二百年</div>
      <div class="g-sub">李守中 著 · 全41章 · 1793–1992 · 简体中文</div>
      <div class="g-label">购书邮箱</div>
      <input class="g-input" id="g-email" type="email" inputmode="email"
             autocomplete="email" placeholder="输入购书时的邮箱地址"
             onkeydown="if(event.key==='Enter')sendLink()">
      <button class="g-btn" id="g-send" onclick="sendLink()">发送一键登录链接</button>
      <div class="g-err" id="g-err"></div>
      <div class="g-note">我们将向您的邮箱发送安全登录链接，点击即可进入阅读，无需密码。</div>
    </div>
    <div id="g-b" style="display:none">
      <div class="g-icon">📬</div>
      <div class="g-msg">登录链接已发送</div>
      <div class="g-detail">请查看 <strong id="g-addr" style="color:var(--cr)"></strong> 的收件箱，点击邮件中的链接进入阅读。<br><br>未收到请检查垃圾邮件。</div>
      <button class="g-link" onclick="showG('a')">换个邮箱重试</button>
    </div>
    <div id="g-c" style="display:none">
      <div class="g-icon">📚</div>
      <div class="g-msg">未找到购书记录</div>
      <div class="g-detail">邮箱 <strong id="g-np" style="color:var(--cr)"></strong> 尚未购买此书。</div>
      <a class="g-btn" href="https://buy.stripe.com/9B614nbd12aM42h50Ydwc06"
         style="display:block;text-align:center;text-decoration:none;margin-bottom:10px">前往购书 $5.90</a>
      <button class="g-link" onclick="doSignOut()">换个账号登录</button>
    </div>
    <div id="g-d" style="display:none">
      <div class="g-icon">⏳</div>
      <div class="g-msg">验证中…</div>
    </div>
  </div>
</div>

<!-- TOPBAR -->
<div id="topbar">
  <button class="tb-btn" onclick="toggleSB()" aria-label="目录">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="16" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="tb-center">中国二百年 <span class="tb-ch" id="tb-ch"></span></div>
  <div class="tb-r">
    <div style="display:flex;gap:2px">
      <button class="f-btn" onclick="setFont(-1)" aria-label="缩小">A⁻</button>
      <button class="f-btn" onclick="setFont(1)"  aria-label="放大">A⁺</button>
    </div>
    <button class="tb-btn" onclick="toggleNight()" aria-label="夜间模式">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</div>
<div id="pbar"><div id="pfill"></div></div>

<!-- SIDEBAR -->
<div id="overlay" onclick="closeSB()"></div>
<div id="sidebar">
  <div class="sb-head">
    <div class="sb-book">中国二百年</div>
    <div class="sb-auth" id="sb-email">李守中 著</div>
    <button class="sb-x" onclick="closeSB()" aria-label="关闭">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
  <ul class="toc-list" id="toc" role="list"></ul>

    <div style="padding:16px 18px;border-top:1px solid var(--parch3);margin-top:8px">
      <button onclick="doSignOut()" style="width:100%;padding:9px;background:none;
        border:1px solid var(--parch3);border-radius:3px;cursor:pointer;
        font-family:inherit;font-size:12px;color:var(--ink3);letter-spacing:.08em;
        -webkit-tap-highlight-color:transparent">退出登录</button>
    </div>
</div>

<!-- READER -->
<div id="reader">
  <div class="ch-wrap">
    <div class="ch-hd">
      <div class="ch-num"  id="rd-num"></div>
      <h1 class="ch-title" id="rd-title"></h1>
    </div>
    <div id="page-body"></div>

    <!-- Page navigation -->
    <div class="page-nav" id="page-nav">
      <button class="pnav-btn" id="btn-pp" onclick="prevPage()" aria-label="上一页">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        <span>上一页</span>
      </button>
      <div class="pnav-info">
        <div><span class="pg-cur" id="pg-cur">1</span> <span class="pg-tot" id="pg-tot">/ 1</span></div>
        <div id="pg-label" style="font-size:10px;color:var(--ink3);margin-top:2px;letter-spacing:.06em"></div>
      </div>
      <button class="pnav-btn" id="btn-np" onclick="nextPage()" aria-label="下一页">
        <span>下一页</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <!-- Chapter navigation (prev/next chapter, shown at last/first page) -->
    <div class="ch-between" id="ch-between" style="display:none">
      <button class="cb-btn" id="btn-pc" onclick="prevChapter()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        <span class="cb-label" id="pc-label">上一章</span>
      </button>
      <button class="cb-btn" id="btn-nc" onclick="nextChapter()">
        <span class="cb-label" id="nc-label">下一章</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- WATERMARK -->
<div id="watermark" aria-hidden="true"></div>

<!-- TOAST -->
<div id="toast" role="status">
  <span id="toast-txt"></span>
  <button onclick="doResume()">继续阅读</button>
  <button class="dim" onclick="closeToast()">从头</button>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

// ═══════════════════════════════════════
//  ★ 填入你的 Supabase 信息
// ═══════════════════════════════════════
const SUPABASE_URL      = 'https://csjbozilckbtkvgvaudq.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_AkkPhcFoEK-mH5sdHSfV0g_3lGQYZee'
// ═══════════════════════════════════════
const BOOK = 'china200'
// 每页目标字符数（不含HTML标签）
const PAGE_CHARS = 700

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

// ── State ──────────────────────────────
let toc = [], cache = {}, cur = 0
let pages = [], curPage = 0
let saveTimer = null, fontSize = +(localStorage.getItem(BOOK+'_font')||17)
let nightMode = localStorage.getItem(BOOK+'_night')==='1'
applySettings()

// ── Auth ───────────────────────────────
sb.auth.onAuthStateChange(async (evt, session) => {
  if (evt==='SIGNED_IN' && session) { showG('d'); await start(session.user.email) }
  if (evt==='SIGNED_OUT') showG('a')
})
;(async()=>{
  showG('d')
  const {data:{session}} = await sb.auth.getSession()
  if (session) await start(session.user.email)
  else showG('a')
})()

window.sendLink = async () => {
  const email = document.getElementById('g-email').value.trim()
  const err = document.getElementById('g-err')
  err.textContent = ''
  if (!email.includes('@')) { err.textContent='请输入有效邮箱地址'; return }
  const btn = document.getElementById('g-send')
  btn.disabled=true; btn.textContent='发送中…'
  const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo:window.location.href}})
  btn.disabled=false; btn.textContent='发送一键登录链接'
  if (error) { err.textContent='发送失败：'+error.message; return }
  document.getElementById('g-addr').textContent=email
  showG('b')
}
window.doSignOut = async () => { await sb.auth.signOut(); showG('a') }

async function start(email) {
  const {data} = await sb.from('purchases').select('id')
    .eq('email',email).in('book',[BOOK,'all']).maybeSingle()
  if (!data) { document.getElementById('g-np').textContent=email; showG('c'); return }
  await loadTOC()
  launchReader(email)
}

async function loadTOC() {
  const {data} = await sb.from('chapter_toc').select('chapter_index,num,title')
    .eq('book',BOOK).order('chapter_index')
  toc = data || []
  buildTOC()
}

function launchReader(email) {
  document.getElementById('gate').style.display='none'
  document.getElementById('topbar').style.display='flex'
  document.getElementById('pbar').style.display='block'
  document.getElementById('reader').style.display='block'
  document.getElementById('sb-email').textContent=email
  buildWatermark(email)
  const pos = getPos()
  if (pos && (pos.chapter>0 || pos.page>0) && toc[pos.chapter]) {
    const ch = toc[pos.chapter]
    document.getElementById('toast-txt').textContent=
      `上次：${ch.num}章《${ch.title}》第${pos.page+1}页`
    setTimeout(()=>document.getElementById('toast').classList.add('show'),800)
  }
  showChapter(0, 0)
}

// ── TOC sidebar ────────────────────────
function buildTOC() {
  const ul = document.getElementById('toc'); ul.innerHTML=''
  toc.forEach((ch,i)=>{
    const li=document.createElement('li')
    li.className='toc-item'; li.setAttribute('role','listitem')
    li.innerHTML=`<span class="toc-n">${ch.num}</span><span class="toc-t">${ch.title}</span>`
    li.onclick=()=>{showChapter(i,0);closeSB()}
    ul.appendChild(li)
  })
}

// ── Paginator ─────────────────────────
function paginateHTML(html) {
  // Parse HTML into element blocks
  const tmp = document.createElement('div')
  tmp.innerHTML = html
  const nodes = Array.from(tmp.childNodes).filter(n =>
    n.nodeType===1 || (n.nodeType===3 && n.textContent.trim())
  )

  const pageList = []
  let curChunks = [], curLen = 0

  for (const node of nodes) {
    const isImg = node.tagName==='FIGURE' || node.querySelector?.('img')
    const isBio = node.className?.includes?.('ai-wrap') ||
                  node.tagName==='STYLE' || node.tagName==='DIV'
    // Bio/style blocks go as single full page
    if (isBio || node.tagName==='STYLE') {
      if (curChunks.length) { pageList.push(curChunks); curChunks=[]; curLen=0 }
      pageList.push([node.outerHTML||node.textContent])
      continue
    }
    const textLen = isImg ? 300 : (node.textContent||'').length
    // Start new page if adding this would exceed limit (but always put ≥1 element per page)
    if (curLen + textLen > PAGE_CHARS && curChunks.length > 0) {
      pageList.push(curChunks)
      curChunks = []; curLen = 0
    }
    curChunks.push(node.outerHTML || node.textContent)
    curLen += textLen
  }
  if (curChunks.length) pageList.push(curChunks)
  return pageList.map(chunks => chunks.join('\n'))
}

// ── Show chapter + page ────────────────
async function showChapter(chIdx, pgIdx, scrollTop=true) {
  if (chIdx<0||chIdx>=toc.length) return
  cur = chIdx
  const ch = toc[chIdx]

  // Update UI
  document.querySelectorAll('.toc-item').forEach((el,j)=>el.classList.toggle('active',j===chIdx))
  document.getElementById('rd-num').textContent = `第${ch.num}章`
  document.getElementById('rd-title').textContent = ch.title
  document.getElementById('tb-ch').textContent = ` · ${ch.title}`
  document.getElementById('pg-label').textContent = ''

  if (scrollTop) window.scrollTo({top:0,behavior:'instant'})

  // Load content
  if (!cache[chIdx]) {
    document.getElementById('page-body').innerHTML=
      '<div class="ch-loading"><div class="spinner"></div>加载中…</div>'
    document.getElementById('page-nav').style.display='none'
    document.getElementById('ch-between').style.display='none'
    const {data,error} = await sb.from('chapters').select('content')
      .eq('book',BOOK).eq('chapter_index',chIdx).single()
    if (error||!data) {
      document.getElementById('page-body').innerHTML=
        '<p style="text-align:center;color:var(--ink3);padding:40px">加载失败，请刷新重试</p>'
      return
    }
    cache[chIdx] = paginateHTML(data.content)
  }

  pages = cache[chIdx]
  curPage = Math.min(pgIdx, pages.length-1)
  renderPage(scrollTop)
}

function renderPage(scrollTop=true) {
  document.getElementById('page-body').innerHTML = pages[curPage] || ''
  if (scrollTop) window.scrollTo({top:0,behavior:'instant'})

  const total = pages.length
  document.getElementById('pg-cur').textContent = curPage+1
  document.getElementById('pg-tot').textContent = `/ ${total}`
  document.getElementById('pg-label').textContent =
    total>1 ? `第${toc[cur].num}章 · 共${total}页` : ''

  document.getElementById('btn-pp').disabled = curPage===0 && cur===0
  document.getElementById('btn-np').disabled = curPage===total-1 && cur===toc.length-1
  document.getElementById('page-nav').style.display='flex'

  // Show chapter nav at last page OR first page
  const atLastPage = curPage===total-1
  const atFirstPage = curPage===0
  const showBetween = atLastPage || atFirstPage
  document.getElementById('ch-between').style.display = showBetween ? 'flex' : 'none'
  if (showBetween) {
    const pcBtn = document.getElementById('btn-pc')
    const ncBtn = document.getElementById('btn-nc')
    pcBtn.disabled = cur===0
    ncBtn.disabled = cur===toc.length-1
    document.getElementById('pc-label').textContent =
      cur>0 ? `← ${toc[cur-1].title}` : '已是第一章'
    document.getElementById('nc-label').textContent =
      cur<toc.length-1 ? `${toc[cur+1].title} →` : '已是最后章'
  }

  updProgress()
  schedSave()
}

window.prevPage = () => {
  if (curPage>0) { curPage--; renderPage() }
  else if (cur>0) showChapter(cur-1, 9999)  // go to last page of prev chapter
}
window.nextPage = () => {
  if (curPage<pages.length-1) { curPage++; renderPage() }
  else if (cur<toc.length-1) showChapter(cur+1, 0)
}
window.prevChapter = () => { if (cur>0) showChapter(cur-1,0) }
window.nextChapter = () => { if (cur<toc.length-1) showChapter(cur+1,0) }

// ── Progress ───────────────────────────
function updProgress() {
  const chPct = (cur + (curPage+1)/Math.max(pages.length,1)) / toc.length
  document.getElementById('pfill').style.width=(chPct*100).toFixed(1)+'%'
}

// ── Save / restore position ────────────
function getPos() { try{return JSON.parse(localStorage.getItem(BOOK+'_pos'))}catch{return null} }
function savePos() {
  localStorage.setItem(BOOK+'_pos',JSON.stringify({chapter:cur,page:curPage,ts:Date.now()}))
}
function schedSave() { clearInterval(saveTimer); saveTimer=setInterval(savePos,3000) }
window.addEventListener('beforeunload',savePos)

window.doResume = () => {
  const p=getPos(); closeToast()
  if (!p) return
  showChapter(p.chapter, p.page||0)
}
window.closeToast = () => document.getElementById('toast').classList.remove('show')

// ── Sidebar ────────────────────────────
window.toggleSB = () => {
  const sb=document.getElementById('sidebar'),ov=document.getElementById('overlay')
  sb.classList.contains('open') ? closeSB() : (sb.classList.add('open'),ov.classList.add('show'))
}
window.closeSB = () => {
  document.getElementById('sidebar').classList.remove('open')
  document.getElementById('overlay').classList.remove('show')
}

// ── Watermark ──────────────────────────
function buildWatermark(email) {
  const wm=document.getElementById('watermark'); wm.innerHTML=''
  const label=`${email} · youxingshijia.com`
  for(let r=0;r<8;r++) for(let c=0;c<4;c++){
    const s=document.createElement('span'); s.className='wm-text'
    s.textContent=label; s.style.top=`${r*13+4}%`; s.style.left=`${c*27-2}%`
    wm.appendChild(s)
  }
}

// ── Settings ───────────────────────────
window.setFont = d => {
  fontSize=Math.max(14,Math.min(22,fontSize+d))
  document.documentElement.style.setProperty('--fs',fontSize+'px')
  localStorage.setItem(BOOK+'_font',fontSize)
}
window.toggleNight = () => {
  nightMode=!nightMode
  document.body.classList.toggle('night',nightMode)
  localStorage.setItem(BOOK+'_night',nightMode?'1':'0')
}
function applySettings() {
  document.documentElement.style.setProperty('--fs',fontSize+'px')
  if(nightMode) document.body.classList.add('night')
}

function showG(s) {
  ['a','b','c','d'].forEach(id=>{
    document.getElementById('g-'+id).style.display=id===s?'block':'none'
  })
}

// Keyboard
document.addEventListener('keydown',e=>{
  if(document.getElementById('gate').style.display!=='none') return
  if(e.key==='ArrowRight'||e.key==='PageDown') nextPage()
  if(e.key==='ArrowLeft' ||e.key==='PageUp')   prevPage()
  if(e.key==='Escape') closeSB()
})

// Swipe (mobile)
let tsX=0
document.addEventListener('touchstart',e=>{ tsX=e.touches[0].clientX },{passive:true})
document.addEventListener('touchend',e=>{
  if(document.getElementById('sidebar').classList.contains('open')) return
  const dx=e.changedTouches[0].clientX-tsX
  if(Math.abs(dx)>60) dx<0 ? nextPage() : prevPage()
},{passive:true})

// Content protection
document.addEventListener('contextmenu',e=>e.preventDefault())
document.addEventListener('selectstart',e=>{
  if(e.target.closest('#reader')) e.preventDefault()
})
document.addEventListener('copy',e=>{
  if(e.target.closest('#reader')){
    e.clipboardData.setData('text/plain','© 李守中著作版权所有 · youxingshijia.com')
    e.preventDefault()
  }
})
</script>
