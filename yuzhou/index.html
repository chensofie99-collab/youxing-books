<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>渔舟唱晚 · 李守中回忆录</title>
<!--
  安全架构说明：
  · 此文件不含任何书的内容（查看源代码只有阅读器界面）
  · 书的内容存储在 Supabase 数据库，受行级安全策略保护
  · 未登录 / 未购书用户无法获取任何章节内容

  上线前填写下方两个值（第 ~70 行）：
  SUPABASE_URL      → Supabase 控制台 > Settings > API > Project URL
  SUPABASE_ANON_KEY → Supabase 控制台 > Settings > API > anon public
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root {
  --parch:#fdf9f2; --parch2:#f2e8d4; --parch3:#dfd0ad;
  --ink:#1a1208; --ink2:#3d2f1a; --ink3:#7a6650;
  --cr:#6b0d0d; --gold:#b8892a;
  --dark:#0c0907; --dark2:#1a120a;
  --sidebar-w:300px; --topbar-h:52px;
  --font-size:17px; --line-h:2.0;
}
.night{
  --parch:#1a1410; --parch2:#221c15; --parch3:#33291e;
  --ink:#e8dcc8; --ink2:#c8b898; --ink3:#8a7a62;
  --cr:#c87070; --gold:#c49a3c;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--font-size);scroll-behavior:smooth}
body{background:var(--parch);color:var(--ink);font-family:'Noto Serif SC',serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
::selection{background:rgba(184,137,42,.22)}

/* GATE */
#gate{position:fixed;inset:0;z-index:1000;background:var(--dark);
  display:flex;align-items:center;justify-content:center}
.gate-box{background:var(--parch2);border:1px solid var(--parch3);border-radius:4px;
  padding:48px 40px;width:380px;max-width:92vw;text-align:center}
.g-title{font-size:26px;font-weight:700;color:var(--cr);margin-bottom:4px;letter-spacing:.06em}
.g-sub{font-family:'EB Garamond',serif;font-style:italic;font-size:14px;
  color:var(--ink3);margin-bottom:28px;letter-spacing:.08em}
.g-label{font-size:11px;color:var(--ink3);text-align:left;margin-bottom:6px;letter-spacing:.08em}
.g-input{width:100%;padding:10px 14px;border:1px solid var(--parch3);
  background:var(--parch);color:var(--ink);font-size:14px;border-radius:2px;
  margin-bottom:14px;outline:none;font-family:inherit}
.g-input:focus{border-color:var(--gold)}
.g-btn{width:100%;padding:12px;background:var(--cr);color:#fdf9f2;border:none;
  border-radius:2px;font-size:13px;letter-spacing:.12em;cursor:pointer;
  font-family:inherit;transition:background .2s}
.g-btn:hover{background:#8b1a1a}
.g-btn:disabled{opacity:.5;cursor:not-allowed}
.g-err{font-size:12px;color:var(--cr);margin-top:10px;min-height:18px}
.g-note{font-size:11px;color:var(--ink3);margin-top:16px;line-height:1.8}
.g-icon{font-size:36px;margin-bottom:14px}
.g-msg{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:10px;letter-spacing:.04em}
.g-detail{font-size:13px;color:var(--ink3);line-height:1.9;margin-bottom:20px}
.g-link{font-size:12px;color:var(--ink3);background:none;border:none;
  cursor:pointer;text-decoration:underline;font-family:inherit;margin-top:8px;display:block}

/* TOP BAR */
#topbar{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--topbar-h);
  background:rgba(253,249,242,.97);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--parch3);display:none;align-items:center;
  padding:0 16px;gap:12px;transition:background .3s}
.night #topbar{background:rgba(26,20,16,.97)}
.tb-btn{background:none;border:none;cursor:pointer;color:var(--ink3);padding:6px;
  border-radius:3px;display:flex;align-items:center;transition:color .2s,background .2s}
.tb-btn:hover{color:var(--cr);background:var(--parch2)}
.tb-btn svg{width:20px;height:20px}
.tb-center{flex:1;text-align:center;font-size:13px;color:var(--ink2);
  letter-spacing:.06em;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-ch{color:var(--ink3);font-weight:400}
.tb-r{display:flex;gap:4px;align-items:center}
.font-btn{background:none;border:1px solid var(--parch3);cursor:pointer;
  color:var(--ink3);padding:3px 7px;border-radius:2px;transition:all .2s;
  font-size:11px;line-height:1;font-family:inherit}
.font-btn:hover{border-color:var(--gold);color:var(--cr)}

/* PROGRESS */
#pbar{position:fixed;top:var(--topbar-h);left:0;right:0;z-index:99;
  height:2px;background:var(--parch3);display:none}
#pfill{height:100%;background:var(--cr);width:0%;transition:width .4s}

/* SIDEBAR */
#sidebar{position:fixed;top:0;left:0;bottom:0;z-index:200;width:var(--sidebar-w);
  max-width:85vw;background:var(--parch);border-right:1px solid var(--parch3);
  transform:translateX(calc(-1 * var(--sidebar-w) - 2px));
  transition:transform .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding-bottom:40px}
#sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.15)}
.sb-head{padding:20px 20px 16px;border-bottom:1px solid var(--parch3);
  position:sticky;top:0;background:var(--parch);z-index:1}
.sb-book{font-size:16px;font-weight:700;color:var(--cr);letter-spacing:.06em}
.sb-auth{font-size:11px;color:var(--ink3);letter-spacing:.1em;margin-top:2px}
.sb-x{position:absolute;top:16px;right:16px;background:none;border:none;
  cursor:pointer;color:var(--ink3);padding:4px}
.sb-x:hover{color:var(--cr)}
.toc-list{list-style:none;padding:8px 0}
.toc-item{display:flex;align-items:baseline;gap:10px;padding:11px 20px;cursor:pointer;
  border-left:2px solid transparent;transition:all .18s}
.toc-item:hover{background:var(--parch2);border-left-color:var(--parch3)}
.toc-item.active{background:rgba(107,13,13,.06);border-left-color:var(--cr)}
.toc-n{font-family:'EB Garamond',serif;font-size:13px;color:var(--gold);flex-shrink:0}
.toc-t{font-size:14px;color:var(--ink2);line-height:1.4}
.toc-item.active .toc-t{color:var(--cr);font-weight:600}
#overlay{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.35);
  opacity:0;pointer-events:none;transition:opacity .3s}
#overlay.show{opacity:1;pointer-events:all}

/* READER */
#reader{padding-top:calc(var(--topbar-h) + 2px);min-height:100vh;display:none}
.ch-wrap{max-width:700px;margin:0 auto;padding:56px 5vw 120px}

/* Chapter header */
.ch-hd{text-align:center;margin-bottom:48px}
.ch-num{font-family:'EB Garamond',serif;font-size:13px;font-style:italic;
  color:var(--gold);letter-spacing:.2em;margin-bottom:10px}
.ch-title{font-size:26px;font-weight:700;color:var(--cr);letter-spacing:.06em;margin-bottom:18px}
.ch-rule{display:flex;align-items:center;justify-content:center;gap:12px}
.ch-rule::before,.ch-rule::after{content:'';flex:0 0 40px;height:1px;
  background:var(--gold);opacity:.5}
.ch-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.6}

/* Body text */
#ch-body p{font-size:1rem;line-height:var(--line-h);color:var(--ink);
  margin-bottom:1.4em;text-indent:2em}
#ch-body p.memoir-text{text-indent:2em;color:var(--ink2);
  border-left:2px solid var(--parch3);padding-left:16px;margin-left:4px}
#ch-body p.memoir-text em.quote{font-family:'EB Garamond',serif;
  font-style:italic;font-size:1.02em;color:var(--ink2);line-height:var(--line-h)}
#ch-body h3.section-head{font-size:1rem;font-weight:600;color:var(--ink2);
  letter-spacing:.08em;text-align:center;margin:2em 0 1.2em}

/* Loading spinner inside reader */
.ch-loading{text-align:center;padding:80px 0;color:var(--ink3);font-size:13px;
  letter-spacing:.1em;display:flex;flex-direction:column;align-items:center;gap:14px}
.spinner{width:28px;height:28px;border:2px solid var(--parch3);
  border-top-color:var(--cr);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Nav */
.ch-nav{display:flex;justify-content:space-between;align-items:center;
  padding:28px 0 0;border-top:1px solid var(--parch3);margin-top:40px}
.nav-btn{display:flex;align-items:center;gap:8px;background:none;
  border:1px solid var(--parch3);color:var(--ink3);padding:10px 18px;
  border-radius:2px;cursor:pointer;font-family:inherit;font-size:13px;
  letter-spacing:.06em;transition:all .2s}
.nav-btn:hover{border-color:var(--cr);color:var(--cr);background:rgba(107,13,13,.04)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.nav-btn svg{width:16px;height:16px}
.pg-txt{font-size:11px;color:var(--ink3);letter-spacing:.08em}

/* Watermark */
#watermark{position:fixed;inset:0;pointer-events:none;z-index:10;
  overflow:hidden;opacity:1}
.wm-text{position:absolute;font-size:11px;color:rgba(0,0,0,.045);
  transform:rotate(-25deg);white-space:nowrap;user-select:none;
  pointer-events:none;letter-spacing:.06em}
.night .wm-text{color:rgba(255,255,255,.04)}

/* Toast */
#toast{position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--dark2);color:rgba(253,249,242,.9);
  padding:12px 20px;border-radius:4px;z-index:300;font-size:13px;
  display:flex;align-items:center;gap:14px;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast button{background:var(--cr);border:none;color:#fdf9f2;
  padding:5px 14px;border-radius:2px;cursor:pointer;font-size:12px;font-family:inherit}
#toast .dim{background:transparent;border:1px solid rgba(253,249,242,.2);
  color:rgba(253,249,242,.5)}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--parch3);border-radius:2px}
@media(max-width:600px){
  :root{--font-size:16px}
  .ch-wrap{padding:40px 4vw 100px}
  .gate-box{padding:36px 24px}
  .nav-btn span{display:none}
}
</style>
</head>
<body>

<!-- GATE -->
<div id="gate">
  <div class="gate-box">
    <!-- A: enter email -->
    <div id="g-a">
      <div class="g-title">渔舟唱晚</div>
      <div class="g-sub">李守中回忆录 · 数字授权版</div>
      <div class="g-label">购书邮箱</div>
      <input class="g-input" id="g-email" type="email" placeholder="输入购书时的邮箱地址"
             onkeydown="if(event.key==='Enter')sendLink()">
      <button class="g-btn" id="g-send" onclick="sendLink()">发送一键登录链接</button>
      <div class="g-err" id="g-err"></div>
      <div class="g-note">我们将向您的邮箱发送一个安全登录链接，点击即可进入阅读，无需密码。</div>
    </div>
    <!-- B: email sent -->
    <div id="g-b" style="display:none">
      <div class="g-icon">📬</div>
      <div class="g-msg">登录链接已发送</div>
      <div class="g-detail">请查看 <strong id="g-addr" style="color:var(--cr)"></strong> 的收件箱，点击邮件中的链接即可进入阅读。<br><br>未收到请检查垃圾邮件。</div>
      <button class="g-link" onclick="showA()">换个邮箱重试</button>
    </div>
    <!-- C: no purchase -->
    <div id="g-c" style="display:none">

      <div class="g-msg">未找到购书记录</div>
      <div class="g-detail">邮箱 <strong id="g-np" style="color:var(--cr)"></strong> 尚未购买此书。</div>
      <a class="g-btn" href="/yuzhou/buy"
         style="display:block;text-align:center;text-decoration:none;margin-bottom:10px">
        前往购书 ¥68
      </a>
      <button class="g-link" onclick="doSignOut()">换个账号登录</button>
    </div>
    <!-- D: loading -->
    <div id="g-d" style="display:none">
      <div class="g-icon">⏳</div>
      <div class="g-msg">验证权限中…</div>
    </div>
  </div>
</div>

<!-- TOP BAR -->
<div id="topbar">
  <button class="tb-btn" onclick="toggleSB()" title="目录">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/>
      <line x1="3" y1="12" x2="16" y2="12"/>
      <line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="tb-center">渔舟唱晚 &nbsp;·&nbsp; <span class="tb-ch" id="tb-ch">第一章</span></div>
  <div class="tb-r">
    <div style="display:flex;gap:2px">
      <button class="font-btn" onclick="setFont(-1)">A⁻</button>
      <button class="font-btn" onclick="setFont(1)">A⁺</button>
    </div>
    <button class="tb-btn" onclick="toggleNight()" title="夜间模式">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</div>
<div id="pbar"><div id="pfill"></div></div>

<!-- SIDEBAR -->
<div id="overlay" onclick="closeSB()"></div>
<div id="sidebar">
  <div class="sb-head">
    <div class="sb-book">渔舟唱晚</div>
    <div class="sb-auth" id="sb-email">李守中 著 · 全十六章</div>
    <button class="sb-x" onclick="closeSB()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>

  </div>
  <ul class="toc-list" id="toc"></ul>
</div>

<!-- READER -->
<div id="reader">
  <div class="ch-wrap">
    <div class="ch-hd">
      <div class="ch-num" id="rd-num">第一章</div>
      <h2 class="ch-title" id="rd-title">蜀道难</h2>
      <div class="ch-rule"><div class="ch-dot"></div></div>
    </div>
    <div id="ch-body"></div>
    <div class="ch-nav">
      <button class="nav-btn" id="btn-prev" onclick="prevCh()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="15 18 9 12 15 6"/>

        <span>上一章</span>
      </button>

          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- WATERMARK (user email, deters screenshot sharing) -->
<div id="watermark"></div>

<!-- RESUME TOAST -->
<div id="toast">
  <span id="toast-txt">上次读到…</span>
  <button onclick="doResume()">继续阅读</button>
  <button class="dim" onclick="closeToast()">从头开始</button>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

// ════════════════════════════════════════════════
//  ★ 填写你的 Supabase 项目信息
// ════════════════════════════════════════════════
const SUPABASE_URL      = 'https://csjbozilckbtkvgvaudq.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_AkkPhcFoEK-mH5sdHSfV0g_3lGQYZee'
// ════════════════════════════════════════════════
const BOOK = 'yuzhou'

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

// ── 状态 ─────────────────────────────────────────
let toc = []         // [{chapter_index, num, title}, ...]
let cache = {}       // { chapter_index: html_content }
let cur = 0
let userEmail = ''
let fontSize = +(localStorage.getItem('yuzhou_font') || 17)
let nightMode = localStorage.getItem('yuzhou_night') === '1'
let saveTimer = null

// ── 初始化 ───────────────────────────────────────
applySettings()

// 监听 auth 变化（用户点击邮件里的链接后跳回此页触发）
sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'SIGNED_IN' && session) {
    showG('d')
    await start(session.user.email)
  }
  if (event === 'SIGNED_OUT') showG('a')
})

// 检查是否已有会话
;(async () => {
  showG('d')
  const { data: { session } } = await sb.auth.getSession()
  if (session) await start(session.user.email)
  else showG('a')
})()

// ── 登录流程 ──────────────────────────────────────
window.sendLink = async () => {
  const email = document.getElementById('g-email').value.trim()
  const err = document.getElementById('g-err')
  err.textContent = ''
  if (!email.includes('@')) { err.textContent = '请输入有效邮箱地址'; return }
  const btn = document.getElementById('g-send')
  btn.disabled = true; btn.textContent = '发送中…'
  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.href }
  })
  btn.disabled = false; btn.textContent = '发送一键登录链接'
  if (error) { err.textContent = '发送失败：' + error.message; return }
  document.getElementById('g-addr').textContent = email
  showG('b')
}

window.showA    = () => showG('a')
window.doSignOut = async () => { await sb.auth.signOut(); showG('a') }

// ── 验证购书 + 启动阅读器 ──────────────────────────
async function start(email) {
  userEmail = email
  const { data } = await sb
    .from('purchases').select('id')
    .eq('email', email).in('book', [BOOK, 'all']).maybeSingle()
  if (!data) {
    document.getElementById('g-np').textContent = email
    showG('c'); return
  }
  await loadTOC()
  launchReader(email)
}

// ── 加载目录（轻量，无正文）──────────────────────────
async function loadTOC() {
  const { data } = await sb
    .from('chapter_toc')
    .select('chapter_index, num, title')
    .eq('book', BOOK)
    .order('chapter_index')
  toc = data || []
  buildTOC()
}

// ── 启动阅读器 ────────────────────────────────────
function launchReader(email) {
  document.getElementById('gate').style.display = 'none'
  document.getElementById('topbar').style.display = 'flex'
  document.getElementById('pbar').style.display = 'block'
  document.getElementById('reader').style.display = 'block'
  document.getElementById('sb-email').textContent = email
  buildWatermark(email)
  const pos = getSavedPos()
  if (pos && pos.chapter > 0 && toc[pos.chapter]) {
    document.getElementById('toast-txt').textContent =
      `上次读到：第${toc[pos.chapter].num}章《${toc[pos.chapter].title}》`
    setTimeout(() => document.getElementById('toast').classList.add('show'), 700)
  }
  showCh(0)
}

// ── 构建目录侧栏 ──────────────────────────────────
function buildTOC() {
  const ul = document.getElementById('toc')
  ul.innerHTML = ''
  toc.forEach((ch, i) => {
    const li = document.createElement('li')
    li.className = 'toc-item'
    li.innerHTML = `<span class="toc-n">${ch.num}</span><span class="toc-t">${ch.title}</span>`
    li.onclick = () => { showCh(i); closeSB() }
    ul.appendChild(li)
  })
}

// ── 显示章节 ──────────────────────────────────────
async function showCh(i, scrollTop = true) {
  if (i < 0 || i >= toc.length) return
  cur = i
  const ch = toc[i]

  // 更新 UI
  document.querySelectorAll('.toc-item').forEach((el, j) =>
    el.classList.toggle('active', j === i))
  document.getElementById('rd-num').textContent = `第${ch.num}章`
  document.getElementById('rd-title').textContent = ch.title
  document.getElementById('tb-ch').textContent = `第${ch.num}章 · ${ch.title}`
  document.getElementById('pg-txt').textContent = `${i + 1} / ${toc.length}`
  document.getElementById('btn-prev').disabled = i === 0
  document.getElementById('btn-next').disabled = i === toc.length - 1

  if (scrollTop) window.scrollTo({ top: 0 })

  // 已缓存直接显示
  if (cache[i]) { renderContent(cache[i]); schedSave(); return }

  // 从 Supabase 按需加载（RLS 在此处生效）
  const body = document.getElementById('ch-body')
  body.innerHTML = '<div class="ch-loading"><div class="spinner"></div>加载中…</div>'

  const { data, error } = await sb
    .from('chapters')
    .select('content')
    .eq('book', BOOK)
    .eq('chapter_index', i)
    .single()

  if (error || !data) {
    body.innerHTML = '<p style="color:var(--ink3);text-align:center;padding:40px">加载失败，请刷新重试</p>'
    return
  }
  cache[i] = data.content
  renderContent(data.content)
  schedSave()
}

function renderContent(html) {
  document.getElementById('ch-body').innerHTML = html
  updProgress()
}

window.nextCh = () => showCh(cur + 1)
window.prevCh = () => showCh(cur - 1)

// ── 进度 ──────────────────────────────────────────
function updProgress() {
  const sp = Math.min(1, window.scrollY / Math.max(1, document.body.scrollHeight - window.innerHeight))
  const pct = ((cur + sp) / toc.length * 100).toFixed(1)
  document.getElementById('pfill').style.width = pct + '%'
}
window.addEventListener('scroll', updProgress, { passive: true })

// ── 记忆位置 ──────────────────────────────────────
function getSavedPos() { try { return JSON.parse(localStorage.getItem('yuzhou_pos')) } catch { return null } }
function savePos() {
  const sp = window.scrollY / Math.max(1, document.body.scrollHeight - window.innerHeight)
  localStorage.setItem('yuzhou_pos', JSON.stringify({ chapter: cur, scroll: sp }))
}
function schedSave() { clearInterval(saveTimer); saveTimer = setInterval(savePos, 3000) }
window.addEventListener('beforeunload', savePos)

window.doResume = () => {
  const p = getSavedPos(); closeToast()
  if (!p) return
  showCh(p.chapter, true)
  if (p.scroll > 0) setTimeout(() => {
    window.scrollTo({ top: p.scroll * (document.body.scrollHeight - window.innerHeight), behavior: 'smooth' })
  }, 150)
}
window.closeToast = () => document.getElementById('toast').classList.remove('show')

// ── 水印（用户邮箱，截图可追溯）─────────────────────
function buildWatermark(email) {
  const wm = document.getElementById('watermark')
  wm.innerHTML = ''
  const label = `${email} · youxingshijia.com`
  const cols = 4, rows = 8
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const span = document.createElement('span')
      span.className = 'wm-text'
      span.textContent = label
      span.style.top  = `${r * 13 + 4}%`
      span.style.left = `${c * 26 - 2}%`
      wm.appendChild(span)
    }
  }
}

// ── 侧边栏 ────────────────────────────────────────
window.toggleSB = () => {
  const sb = document.getElementById('sidebar'), ov = document.getElementById('overlay')
  sb.classList.contains('open') ? closeSB() : (sb.classList.add('open'), ov.classList.add('show'))
}
window.closeSB = () => {
  document.getElementById('sidebar').classList.remove('open')
  document.getElementById('overlay').classList.remove('show')
}

// ── 设置 ──────────────────────────────────────────
window.setFont = d => {
  fontSize = Math.max(14, Math.min(22, fontSize + d))
  document.documentElement.style.setProperty('--font-size', fontSize + 'px')
  localStorage.setItem('yuzhou_font', fontSize)
}
window.toggleNight = () => {
  nightMode = !nightMode
  document.body.classList.toggle('night', nightMode)
  localStorage.setItem('yuzhou_night', nightMode ? '1' : '0')
}
function applySettings() {
  document.documentElement.style.setProperty('--font-size', fontSize + 'px')
  if (nightMode) document.body.classList.add('night')
}

// ── Gate 状态切换 ──────────────────────────────────
function showG(s) {
  ['a','b','c','d'].forEach(id => {
    document.getElementById('g-' + id).style.display = id === s ? 'block' : 'none'
  })
}

// ── 键盘快捷键 ────────────────────────────────────
document.addEventListener('keydown', e => {
  if (document.getElementById('gate').style.display !== 'none') return
  if (e.key === 'ArrowRight' || e.key === 'PageDown') nextCh()
  if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   prevCh()
  if (e.key === 'Escape') closeSB()
})

// ── 内容保护 ──────────────────────────────────────
document.addEventListener('contextmenu', e => e.preventDefault())
document.addEventListener('selectstart', e => {
  if (e.target.closest('#reader')) e.preventDefault()
})
document.addEventListener('copy', e => {
  if (e.target.closest('#reader')) {
    e.clipboardData.setData('text/plain', '© 李守中著作版权所有 · youxingshijia.com')
    e.preventDefault()
  }
})
</script>
